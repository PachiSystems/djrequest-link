name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Refuse committed databases, exports, secrets, and real paths
        run: node scripts/check-repo.js

  test:
    name: Test (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Syntax check
        run: npm run lint
      - name: Tests
        run: npm test
        env:
          # Real OS keychain round-trip (macOS Keychain / Windows Credential
          # Manager). Linux runners have no unlocked Secret Service.
          DJREQUEST_KEYCHAIN_SELFTEST: ${{ matrix.os != 'ubuntu-latest' && '1' || '' }}
